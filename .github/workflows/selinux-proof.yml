name: SELinux subs_dist proof (fork only)

# Fork-only proof build for the file_contexts.subs_dist fix on this branch
# (ublue-os/bluefin-lts#1599, ublue-os/bluefin#4976). Builds bluefin-dx the way
# reusable-build-image.yml does for build-dx.yml off a non-lts branch (amd64,
# DEFAULT_TAG lts-testing, ENABLE_DX=1, GNOME 49), then reads the file and the
# resulting labels inside the image, next to the published control image.
# Nothing is pushed or signed. Not for upstream.

on:
  push:
    branches:
      - test/selinux-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bluefin-dx
  DEFAULT_TAG: "lts"
  CENTOS_VERSION: stream10

jobs:
  build:
    name: Build bluefin-dx (lts-testing, amd64) and check file_contexts.subs_dist
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Check Just Syntax
        shell: bash
        run: just check

      # Same command as reusable-build-image.yml's "Build Image" step for
      # build-dx.yml on a non-production branch: tag lts-testing, DX on, GDX/HWE off,
      # no kernel pin, GNOME 49. No rechunk, no push.
      - name: Build Image (bluefin-dx lts-testing, no push)
        shell: bash
        run: |
          set -x
          just=$(which just)
          export TAG_SUFFIX="testing"
          export DEFAULT_TAG="${DEFAULT_TAG}-${TAG_SUFFIX}"
          sudo $just build "${IMAGE_NAME}" "${DEFAULT_TAG}" 1 0 0 "" 49

      - name: Inspect the built image
        shell: bash
        run: |
          sudo podman image inspect localhost/bluefin-dx:lts-testing --format 'built: {{index .Labels "org.opencontainers.image.version"}} {{.Id}}'
          sudo podman run --rm localhost/bluefin-dx:lts-testing sh -c 'grep -n home /etc/selinux/targeted/contexts/files/file_contexts.subs_dist; rpm -q selinux-policy-targeted; matchpathcon /var/home/x/.ssh /var/home/x/.ssh/authorized_keys'

      - name: Assert ~/.ssh labels as ssh_home_t on the built image
        shell: bash
        run: |
          sudo podman run --rm localhost/bluefin-dx:lts-testing matchpathcon -n /var/home/x/.ssh | grep -F ':ssh_home_t:'

      - name: Control, published ghcr.io/ublue-os/bluefin-dx:lts-testing (expected default_t until the fix ships)
        shell: bash
        run: |
          sudo podman pull -q ghcr.io/ublue-os/bluefin-dx:lts-testing
          sudo podman image inspect ghcr.io/ublue-os/bluefin-dx:lts-testing --format 'control: {{index .Labels "org.opencontainers.image.version"}} {{.Digest}}'
          sudo podman run --rm ghcr.io/ublue-os/bluefin-dx:lts-testing sh -c 'grep -n home /etc/selinux/targeted/contexts/files/file_contexts.subs_dist; rpm -q selinux-policy-targeted; matchpathcon /var/home/x/.ssh /var/home/x/.ssh/authorized_keys'
